<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      padding: 50px;
      background-color: #f0f0f0;
    }

    input {
      padding: 10px;
      font-size: 16px;
      width: 250px;
      margin: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
    }

    button:hover {
      background-color: #45a049;
    }

    #weather {
      margin-top: 30px;
      font-size: 20px;
      padding: 20px;
      background-color: white;
      border-radius: 10px;
      display: inline-block;
      min-width: 300px;
    }
  </style>
</head>
<body>
  <h1>Weather App</h1>
  <input type="text" id="location" placeholder="Enter city name">
  <button id="getWeather">Get Weather</button>
  <div id="weather"></div>

  <script>
    const locationInput = document.getElementById('location');
    const getWeatherBtn = document.getElementById('getWeather');
    const weatherDiv = document.getElementById('weather');

    getWeatherBtn.addEventListener('click', async () => {
      const city = locationInput.value.trim();
      
      if (!city) {
        weatherDiv.textContent = 'Please enter a city name';
        return;
      }

      weatherDiv.textContent = 'Loading...';

      try {
        // Using wttr.in free weather API (no API key needed)
        const response = await fetch(`https://wttr.in/${city}?format=j1`);
        const data = await response.json();

        const temp = data.current_condition[0].temp_C;
        const description = data.current_condition[0].weatherDesc[0].value;
        const feelsLike = data.current_condition[0].FeelsLikeC;

        weatherDiv.innerHTML = `
          <h2>${city}</h2>
          <p>Temperature: ${temp}°C</p>
          <p>Feels Like: ${feelsLike}°C</p>
          <p>Condition: ${description}</p>
        `;
      } catch (error) {
        weatherDiv.textContent = 'Error fetching weather. Please try again.';
      }
    });
  </script>
</body>
</html>
